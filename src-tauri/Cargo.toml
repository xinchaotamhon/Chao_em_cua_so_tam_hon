[package]
name = "chao-em-cua-so-tam-hon"
version = "2.1.3"
description = "Nhắc nghỉ mắt theo quy tắc 20-20-20."
authors = ["Nguyễn Ái Dân"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "chao_em_cua_so_tam_hon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
tauri = { version = "2.0.6", features = [ "protocol-asset", "tray-icon", "image-png" ] }
tauri-plugin-shell = "2.0.2"
serde = { version = "1.0.214", features = ["derive"] }
serde_json = "1.0.132"
tauri-plugin-store = "2.1.0"
tauri-plugin-process = "2"
tauri-plugin-notification = "2.0.1"
# Pinned to the 2.0.x line on purpose: 2.5.5 requires tauri ^2.12, which would drag the
# whole app onto a newer Tauri than the one this fork was proved against.
tauri-plugin-single-instance = "2.0.2"
# 2.2.1 is the last dialog release that still accepts tauri ^2.
tauri-plugin-dialog = "2.2.1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.0.1"
